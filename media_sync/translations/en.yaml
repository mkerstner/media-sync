configuration:
  source:
    name: Source server
    description: >-
      The server to sync with, and where on it to start. The app logs in over
      SSH with a key it creates for itself, so there is no password to set.
      WebDAV needs a password, so use an app password rather than your account
      one.
    fields:
      protocol:
        name: How to connect
        description: >-
          SSH suits a NAS, a VPS or a rented storage box. WebDAV suits
          Nextcloud and anything else that speaks it. Fields you do not need
          for your choice can be left empty.
      remote_host:
        name: Address
        description: >-
          Hostname or IP of the server, for example storage.example.com.
      remote_user:
        name: Username
        description: The account to log in as on that server.
      remote_port:
        name: Port
        description: The port the server listens on for SSH. Usually 22.
      webdav_url:
        name: WebDAV address
        description: >-
          The full WebDAV address. Nextcloud shows it at the bottom of its
          Files page, and it looks like
          https://cloud.example.com/remote.php/dav/files/USERNAME/
      webdav_user:
        name: WebDAV username
        description: The account name on that server.
      webdav_pass:
        name: WebDAV password
        description: >-
          Use an app password, not your account password. In Nextcloud create
          one under Settings, Security, Create new app password. It can be
          revoked on its own and keeps working with two-factor login.
      remote_base:
        name: Base folder
        description: >-
          The folder that the remote paths below are counted from. Leave it
          empty to start from the home folder of the account you log in as.
  sync:
    name: Syncing
    description: >-
      How the sync behaves, and what it should leave out.
    fields:
      direction:
        name: Direction
        description: >-
          Both compares the two sides and keeps whichever copy of a file is
          newer. Pull only brings files down from the server, push only sends
          them up.
      force_removal:
        name: Remove leftover folders
        description: >-
          Off by default. When you confirm a folder should go and it still
          holds files the sync ignores, such as Thumbs.db, the sync cannot
          remove it and it comes back asking again next time. Turn this on
          to have those folders removed for good. Only folders you have
          already confirmed are touched; ignored files elsewhere are left
          alone either way.
      dry_run:
        name: Test run only
        description: >-
          Go through the motions and report what would happen, without copying
          or deleting anything. Useful for checking your settings before the
          first real sync. While this is on it applies to every run, including
          ones started from Home Assistant.
      delete_protection:
        name: Deletion protection
        description: >-
          On by default, and it is what stops a sync removing anything on
          its own. While it is on, a file that is on one side but not the
          other is listed and left alone, and Home Assistant asks you
          before it goes. Turn it off and every run deletes as it goes,
          with nothing to confirm. You can turn it back on at any time.
      include_dirs:
        name: Only sync these folders
        description: >-
          Leave this empty to sync everything. If you add entries, only those
          top-level folders are synced and the rest is ignored.
      exclude_patterns:
        name: Never sync these
        description: >-
          Patterns for things to always skip, such as system files and half
          finished downloads. Anything skipped here is also safe from deletion.
  folders:
    name: Folders to keep in sync
    description: >-
      Each entry pairs one folder on the server with one in Home Assistant.
    fields:
      name:
        name: Label
        description: A short name for this pair, used in the log.
      remote:
        name: Folder on the server
        description: >-
          Counted from the base folder above. Use a single dot for all of it.
      local:
        name: Folder in Home Assistant
        description: The full path on this machine, such as /media/Movies.
      exclude:
        name: Skip within this pair
        description: >-
          Comma-separated patterns to leave out of this pair only.
  advanced:
    name: Advanced
    description: >-
      Logging and troubleshooting. The defaults are fine for everyday use.
    fields:
      log_level:
        name: App logging
        description: >-
          How much the app itself writes to its log. Leave this on info unless
          you are chasing a problem, then try debug.
      sync_log_verbosity:
        name: Sync logging
        description: >-
          How much the sync writes while it runs. Summary gives totals only,
          files lists what moved, changes also says what was different about
          each file, and progress adds a live percentage. The higher settings
          fill the log faster.
      log_keep_days:
        name: Keep log entries for
        description: >-
          How many days of activity to keep in the shared log. Older entries
          are removed each time the app starts. The log also has a size limit
          of its own, so one very noisy run cannot fill your backups.
