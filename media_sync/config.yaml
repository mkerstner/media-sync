name: Media Sync
version: "2.3.1"
slug: media_sync
url: https://github.com/mkerstner/media-sync/tree/main/media_sync
description: Two-way sync between your media library and a remote server, over SSH or WebDAV such as Nextcloud - from the UI, an automation or a terminal
# Without an "image" key the Supervisor builds from the Dockerfile on the
# user's own machine. Add
#   image: ghcr.io/mkerstner/media-sync-{arch}
# only once the build workflow has published images for every arch listed
# below AND those packages are public - otherwise installing fails with a 403.
# Each version bump then needs a matching published tag.
arch:
  - aarch64
  - amd64
# Runs once per invocation and exits; Home Assistant starts it on demand.
init: false
startup: once
boot: manual
map:
  - type: media
    read_only: false
  # homeassistant_config would mount at /homeassistant by default; pin it to
  # /config so every path in the app, the docs and the integration stays put.
  - type: homeassistant_config
    path: /config
    read_only: false
  - type: ssl
    read_only: false
# Settings are grouped so the options screen reads in sections. "folders" is a
# list of dictionaries, which is already the deepest nesting the Supervisor
# allows, so it cannot sit inside a group - it stays here between them.
options:
  source:
    protocol: SSH
    remote_base: ""
  ssh:
    host: storage.example.com
    user: username
    port: 22
  webdav:
    url: ""
    user: ""
    password: ""
  sync:
    direction: both
    dry_run: false
    delete_protection: true
    force_removal: false
    include_dirs: []
    exclude_patterns:
      - .DS_Store
      - ._*
      - Thumbs.db
      - desktop.ini
      - "@eaDir/"
      - "#recycle/"
      - lost+found/
      - .Trash-*/
      - $RECYCLE.BIN/
      - System Volume Information/
      - "*.tmp"
      - "*.partial"
      - .DAV/
  folders:
    - name: Media
      remote: Media
      local: /media/Media
      exclude: ""
    - name: Documents
      remote: "."
      local: /media/Documents
      exclude: /Media/
  advanced:
    log_level: info
    sync_log_verbosity: summary
    log_keep_days: 14
    webdav_parallel: 16
    skip_unchanged: true
    change_depth: 2
schema:
  source:
    protocol: list(SSH|WebDAV)
    remote_base: str?
  ssh:
    host: str?
    user: str?
    port: port?
  webdav:
    url: str?
    user: str?
    password: password?
  sync:
    direction: list(both|pull|push)
    dry_run: bool
    delete_protection: bool
    force_removal: bool
    include_dirs:
      - str
    exclude_patterns:
      - str
  folders:
    - name: str
      remote: str
      local: str
      exclude: str?
  advanced:
    log_level: list(trace|debug|info|notice|warning|error|fatal)
    sync_log_verbosity: list(quiet|summary|files|changes|progress|debug)
    log_keep_days: int(1,365)
    webdav_parallel: int(1,64)
    skip_unchanged: bool
    change_depth: int(0,10)
